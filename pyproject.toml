[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainofproof"
version = "0.1.0"
description = "Autonomous digital forensics and evidence correlation agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "python-evtx",
    "defusedxml",
    "pyyaml",
    "python-dotenv",
    "httpx",
    "ollama",
    "rich",
    "typer",
    "networkx",
]

[project.scripts]
chainofproof = "chainofproof.cli:app"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: test requires a running Ollama server (deselect with -m 'not llm')",
    "dataset: needs data/downloads/EVTX-ATTACK-SAMPLES (skips cleanly if missing)",
]
