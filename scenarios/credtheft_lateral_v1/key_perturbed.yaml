      record_id: 266
      path: C:\Windows\PSEXESVC.exe
      si_created: '2021-06-15T12:36:37Z'
      fn_created: '2024-03-12T09:40:00Z'
      delta_seconds: 86475803
    - source_key: fs_srv_file_02
      record_id: 267
      path: C:\Windows\svchost.exe
      si_created: '2021-06-15T14:19:20Z'
      fn_created: '2024-03-12T09:54:57Z'
      delta_seconds: 86470537
