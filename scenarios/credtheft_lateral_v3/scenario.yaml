stages:
- stage_id: S1
  name: Credential theft
  attack_technique_ids:
  - T1003.001
  description: Mimikatz reads LSASS memory on the victim workstation.
  role: storyline
- stage_id: S2
  name: Use of stolen credential (pass-the-hash)
  attack_technique_ids:
  - T1070.001
  - T1550.002
  description: A NewCredentials logon with the stolen secret, shortly after the Security log was cleared.
  role: storyline
- stage_id: S3
  name: Remote service execution (PowerShell stager)
  attack_technique_ids:
  - T1021.002
  - T1569.002
  description: A new service on the file server launches a hidden PowerShell chain; an inbound SMB connection
    and the ntsvcs pipe are visible, but no network logon and no admin-share copy.
  role: storyline
- stage_id: S4
  name: Defense evasion via renamed PsExec service
  attack_technique_ids:
  - T1036.003
  - T1569.002
  description: PsExec service binary disguised as svchost.exe.
  role: storyline
- stage_id: S5
  name: Domain credential dump
  attack_technique_ids:
  - T1003.006
  description: 'DCSync: replication rights abused against the DC.'
  role: storyline
