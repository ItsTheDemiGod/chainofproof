contradictions:
- id: GT-CON-001
  kind: timestomp
  sources_involved:
  - fs_srv_file_02
  - s4_renamed_psexec
  description: Two attacker-dropped binaries on SRV-FILE-02 (the renamed service binary and the PsExec
    client) have $STANDARD_INFORMATION created/modified times set to 2021-06-15 while $FILE_NAME times
    keep the true drop time.
  magnitude: 2.0
  magnitude_unit: count
  params:
    host: SRV-FILE-02
    files:
    - source_key: fs_srv_file_02
      record_id: 280
      path: C:\Windows\svchost.exe
      si_created: '2021-06-15T12:25:28Z'
      fn_created: '2024-03-12T09:57:30Z'
      delta_seconds: 86477522
      pairing_field: image_basename
      pairing_value: svchost.exe
    - source_key: fs_srv_file_02
      record_id: 345
      path: C:\Windows\system32\PsExec.exe
      si_created: '2021-06-15T15:12:05Z'
      fn_created: '2024-03-12T09:57:21Z'
      delta_seconds: 86467516
      pairing_field: image_basename
      pairing_value: psexec.exe
  detectable_by: 'si_created differs from fn_created by more than a day within the SAME file-system record.
    This is the only check that works: no real event records the creation of these files, so there is
    no cross-source creation-time comparison.'
  checks:
  - si_fn_mismatch
  expected_collateral_conn_ids: []
- id: GT-CON-002
  kind: clock_skew
  sources_involved:
  - auth_srv_file_02
  - s4_renamed_psexec
  description: Every auth-log line of SRV-FILE-02 (340 lines, benign background and the synthetic cross-host
    link lines included) is 420 s later than reality.
  magnitude: 420.0
  magnitude_unit: seconds
  params:
    host: SRV-FILE-02
    source_key: auth_srv_file_02
    shift_seconds: 420
    lines_shifted: 340
    paired_lines:
    - seq: 101
      pairing_field: pipe_name
      pairing_value: svchost-MSEDGEWIN10-8116-stderr
      real_source_key: s4_renamed_psexec
      real_record_ids:
      - 409652
      aligned_real_time: '2024-03-12T09:57:34Z'
      clean_delta_seconds: 0
      perturbed_delta_seconds: 420
    - seq: 102
      pairing_field: pipe_name
      pairing_value: svchost-MSEDGEWIN10-8116-stdin
      real_source_key: s4_renamed_psexec
      real_record_ids:
      - 409650
      aligned_real_time: '2024-03-12T09:57:34Z'
      clean_delta_seconds: 0
      perturbed_delta_seconds: 420
    - seq: 103
      pairing_field: pipe_name
      pairing_value: svchost-MSEDGEWIN10-8116-stdout
      real_source_key: s4_renamed_psexec
      real_record_ids:
      - 409651
      aligned_real_time: '2024-03-12T09:57:34Z'
      clean_delta_seconds: 0
      perturbed_delta_seconds: 420
    cross_host_pairs:
    - conn_id: CONN-0031
      source_side:
        source_key: auth_ws_fin_07
        seq: 76
      dest_side:
        source_key: auth_srv_file_02
        seq: 82
      clean_delta_seconds: 0
      perturbed_delta_seconds: 420
  detectable_by: 'paired lines: each NAMED_PIPE_OPEN line carries pair=pipe_name:<name>, the pipe name
    of a real S4 Sysmon 18 event; after the alignment layer the line time minus the real event time (whole
    seconds) is 0 s in the clean variant and +420 s in the perturbed variant for every paired line. cross_host_pair_delta:
    the two ends of CONN-0031 (WS-FIN-07 CONN_OUT, SRV-FILE-02 LOGON_SUCCESS, same conn_id) differ by
    exactly 0 s in the clean variant and +420 s in the perturbed variant; every benign connection with
    one end on SRV-FILE-02 is shifted the same way (+420 s when SRV-FILE-02 holds the destination end,
    -420 s when it holds the source end); this compares SYNTHETIC with SYNTHETIC lines, no real event
    is involved'
  checks:
  - paired_line_time_delta
  - cross_host_pair_delta
  expected_collateral_conn_ids: []
- id: GT-CON-003
  kind: log_gap
  sources_involved:
  - auth_dc_01
  - s5_dcsync
  description: All 29 DC-01 auth-log lines in a 12-minute window containing the DCSync event are missing
    (seq 211 to 239), among them the destination-side line of the synthetic connection CONN-0054 and the
    DC-01 end of 4 benign connections; seq jumps over the window.
  magnitude: 720.0
  magnitude_unit: seconds
  params:
    host: DC-01
    source_key: auth_dc_01
    window_start: '2024-03-12T10:30:22Z'
    window_end: '2024-03-12T10:42:22Z'
    removed_lines: 29
    first_removed_seq: 211
    last_removed_seq: 239
    real_source_key: s5_dcsync
    real_record_ids_inside_window:
    - 202791
    - 202792
    - 202793
    unmatched_connections:
    - conn_id: CONN-0054
      present_side: source
      present:
        source_key: auth_srv_file_02
        seq: 141
      missing:
        source_key: auth_dc_01
        seq: 227
  detectable_by: 'seq discontinuity in the DC-01 auth log, plus real S5 4662 events (record ids in real_record_ids_inside_window)
    whose aligned time falls inside the missing window. unmatched_connection: the SRV-FILE-02 source-side
    line of CONN-0054 has no destination-side counterpart on DC-01 (removed in the window); in the clean
    variant every conn_id has both ends. The removal also breaks benign connections: every conn_id in
    expected_collateral_conn_ids loses its DC-01 end and shows up as unmatched too (expected collateral
    of the gap, not a separate contradiction)'
  checks:
  - seq_discontinuity
  - real_events_inside_gap
  - unmatched_connection
  expected_collateral_conn_ids:
  - CONN-0049
  - CONN-0051
  - CONN-0052
  - CONN-0053
