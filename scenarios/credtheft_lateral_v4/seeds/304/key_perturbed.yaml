missing_evidence:
- id: GT-MIS-001
  description: No network packet capture is available, so the SMB data movement and the content of the
    PsExec/replication traffic cannot be inspected.
  confirms_claim: 'S3/S5: that remote service creation and replication crossed the network from WS-FIN-07'
- id: GT-MIS-002
  description: 'No endpoint logs exist for the attacker''s initial access (how the first foothold on WS-FIN-07
    was obtained: phishing, exploit, valid account).'
  confirms_claim: The initial-access stage and the origin of the attack
- id: GT-MIS-003
  description: No memory image of WS-FIN-07 or DC-01 is available.
  confirms_claim: 'S1/S5: that credentials were actually extracted and which accounts were exposed'
- id: GT-MIS-004
  description: 'Real network-authentication evidence is still absent: no Security 4624 type 3 / 5140 /
    5145 and no ADMIN$ file copy exist for the remote service creation on SRV-FILE-02, and the real S5
    4662 events show no source address. The real S3 file shows only the ntsvcs pipe, an inbound TCP 445
    connection and the service/PowerShell activity. The SYNTHETIC synth_only cross-host lines (CONN-0031,
    CONN-0054) stand in for this evidence; they are not proof that it exists in the real captures.'
  confirms_claim: 'S3/S5: which account authenticated, from which host, and that an admin share was used'
